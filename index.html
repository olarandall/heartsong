<style>

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#2e2610 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1f1a0c 0%,transparent 60%),var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:22px 20px 120px}
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em}
h1{font-size:clamp(34px,8vw,48px);line-height:1.05}
h2{font-size:clamp(26px,6.5vw,34px);line-height:1.12;margin-bottom:8px}
.sub{color:var(--muted);font-size:16px;line-height:1.5}
.brand{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700}
.brand .dot{width:28px;height:28px;border-radius:50%;background:var(--glow);display:grid;place-items:center;color:#0a0a0a;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:6px 0}
.progress{height:6px;background:#1f1d18;border-radius:9px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--glow);border-radius:9px;transition:width .4s ease}
.meta{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:12px 18px;font:500 16px Jost,system-ui,sans-serif;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#8a7340}
.chip.on{background:var(--glow);color:#0a0a0a;border-color:transparent;font-weight:700;box-shadow:0 6px 22px -8px #b8913a}
.label{font-weight:700;font-size:15px;margin:22px 0 4px;color:var(--ink)}
.hint{color:var(--dim);font-size:13.5px;margin-top:4px}
input[type=text],textarea,select{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;padding:15px 16px;font:400 17px Jost,system-ui,sans-serif;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--amber)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
::placeholder{color:#5f594f}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sparks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.spark{background:#181714;border:0;color:var(--muted);border-radius:10px;padding:7px 11px;font:500 13.5px Jost,system-ui,sans-serif;cursor:pointer}
.spark:hover{color:var(--ink)}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:6px}
.count .bad{color:var(--rose)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px}
.btn{flex:1;border:0;border-radius:999px;padding:17px 22px;font:700 17px Jost,system-ui,sans-serif;cursor:pointer;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--glow);color:#0a0a0a;box-shadow:0 10px 30px -10px #b8913a}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.pill{display:inline-flex;gap:6px;align-items:center;background:#161513;color:var(--muted);border-radius:999px;padding:8px 13px;font-size:14px}
.hero{padding-top:30px}
.hero h1 em{font-style:italic;background:var(--glow);-webkit-background-clip:text;background-clip:text;color:transparent}
.how{display:grid;gap:12px;margin:28px 0}
.how div{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.how b{display:grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:#1c1a15;color:var(--amber);font-size:14px}
.how p{color:var(--muted);font-size:15px;line-height:1.45}
.how strong{color:var(--ink);display:block;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.review dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
.review dt{color:var(--dim)} .review dd{color:var(--ink)}
.review .edit{color:var(--amber);background:none;border:0;font:inherit;font-size:13px;cursor:pointer;margin-left:6px}
/* generating */
.gen{text-align:center;padding-top:60px}
.vinyl{width:180px;height:180px;margin:0 auto 34px;border-radius:50%;background:repeating-radial-gradient(circle,#050505 0 3px,#141414 3px 5px);position:relative;animation:spin 2.4s linear infinite;box-shadow:0 0 80px -10px #c9a24a44}
.vinyl:after{content:"♥";position:absolute;inset:62px;border-radius:50%;background:var(--glow);display:grid;place-items:center;color:#0a0a0a;font-size:22px}
@keyframes spin{to{transform:rotate(360deg)}}
.stages{list-style:none;margin:26px auto 0;max-width:330px;text-align:left}
.stages li{padding:8px 0;color:var(--dim);display:flex;gap:10px;align-items:center;font-size:15px;transition:color .3s}
.stages li.on{color:var(--ink)} .stages li.done{color:var(--muted)}
.stages li:before{content:"";width:9px;height:9px;border-radius:50%;background:#2e2a22;flex:0 0 9px}
.stages li.on:before{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.stages li.done:before{background:#a9c9a0}
/* result */
.songhead{text-align:center;padding:16px 0 6px}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--amber);font-weight:700}
.songhead h2{font-size:clamp(30px,8vw,42px);margin:10px 0 6px}
.tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.lyrics{background:linear-gradient(180deg,#121212,#0d0d0d);border:1px solid var(--line);border-radius:22px;padding:24px 22px;margin:22px 0}
.sec{margin-bottom:22px}
.sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--rose);margin-bottom:8px}
.sec.chorus{border-left:3px solid var(--amber);padding-left:14px}
.sec p{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.55;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.tool{background:#161513;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 14px;font:500 14.5px Jost,system-ui,sans-serif;cursor:pointer}
.tool:hover{border-color:var(--amber)}
.tool:disabled{opacity:.4}
.why{color:var(--muted);font-size:15px;line-height:1.55;font-style:italic;text-align:center;margin:0 10px}
.studio h3{font-family:'Cormorant Garamond',serif;font-size:22px;margin-bottom:6px}
.studio ol{padding-left:20px;color:var(--muted);line-height:1.6;font-size:15px;margin:10px 0}
.studio a{color:var(--amber)}
pre.pack{white-space:pre-wrap;background:#0b0b0b;border-radius:12px;padding:14px;font:13px/1.5 ui-monospace,Menlo,monospace;color:#e8e2d4;max-height:220px;overflow:auto;margin:10px 0}
audio{width:100%;margin-top:12px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);background:#f8f5ee;color:#0a0a0a;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.err{background:#231312;border:1px solid #6b3a2e;color:#f0d6cc;border-radius:14px;padding:14px;margin-top:16px;font-size:15px}
.album{position:relative;width:min(250px,64vw);aspect-ratio:1;margin:8px auto 22px}
.album .rec{position:absolute;top:4%;left:4%;width:92%;height:92%;border-radius:50%;background:repeating-radial-gradient(circle,#050505 0 3px,#141414 3px 5px);transform:translateX(30%);box-shadow:0 10px 30px -10px #000}

.album .sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.album .def{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;background:radial-gradient(circle at 50% 30%,#2a2412,#0a0a0a 70%)}
.album .def b{font-size:34px;color:#e8cf8a}
.album .def span{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;line-height:1.15}
.album .def small{letter-spacing:.3em;text-transform:uppercase;font-size:9px;color:#bdb5a6}
.coverbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-4px 0 10px}
.coverbtns label,.coverbtns button{cursor:pointer}
.promo{position:relative;margin:24px auto 22px;height:min(58vh,560px);aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;border:1px solid #8a7340;box-shadow:0 30px 70px -25px #000,0 0 80px -30px #c9a24a88;background:#0d0d0d}
.promo video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.snd{position:absolute;right:12px;bottom:12px;background:#0a0a0acc;color:#f8f5ee;border:1px solid #8a7340;border-radius:999px;padding:9px 14px;font:500 13px Jost,system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

body{letter-spacing:.01em}
h1,h2,.serif{font-weight:600;letter-spacing:0}
h1{font-size:clamp(40px,10vw,58px)} h2{font-size:clamp(30px,7.5vw,40px)}

.gold-text,.hero h1 em{background:linear-gradient(135deg,#a8802f 0%,#f3dc8f 48%,#c49a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

.sec.chorus{border-left:1px solid #d9b45a}
.how b{background:transparent;border:1px solid #8a7340;color:#e8cf8a;font-family:'Cormorant Garamond',serif;font-size:17px}
.tool{background:transparent;border-color:#2e2a22}
.tool:hover{border-color:#d9b45a}
input[type=text],textarea,select{background:#0f0f0f;border:1px solid #2e2a22}

.toast{background:linear-gradient(135deg,#a8802f,#f3dc8f 48%,#c49a3c);color:#0a0a0a}
</style>

function songPrompt(tweak,prev){
  return `You are a hit songwriter who writes personalized gift songs that make people cry and replay them 50 times. Write an ORIGINAL song from this brief.

${brief()}

TREND PLAYBOOK FOR THIS STYLE (${TRENDS_UPDATED})
- Sound: ${niche().s}
- Lyric approach: ${niche().l}
Write it the way a current hit in exactly this style is written: its vocabulary, rhythm of phrasing, rhyme density and attitude. It must feel like it belongs on a ${d.genre} playlist today, not like a greeting card.

VIRAL SONG RULES
- Hook first: open with a striking, specific line or a 1–2 line [Intro] that teases the hook. No slow throat-clearing. The first chorus must arrive fast (Verse 1 is 4 lines, Pre-Chorus 2 lines).
- The hook: 2–6 words, singable after one listen, repeated at least 3 times per chorus. It becomes the title. Work in ${d.name}${d.nick?` or "${d.nick}"`:""} where it scans naturally; don't force it.
- Earworm: for upbeat styles add a short [Post-Chorus] (chant, name chant, or "oh-oh" melody). For ballads, use a repeated tag line instead.
- The clip moment: write 2–4 consecutive lines (about 15–20 seconds sung) that are the most quotable, specific and emotional lines of the song: lines people would put on screen in a TikTok or Reel of the recipient's reaction. Usually the chorus or the bridge.
- Screenshot lines: specific, conversational, a little surprising. Use real details from the memories (places, objects, phrases, inside jokes) as images. Never invent big facts that aren't in the brief; small sensory color is fine.
- BANNED clichés: "heart of gold", "light up my world", "shining star", "you complete me", "angel sent from above", "forever and always", "by my side through thick and thin", "words can't express", "my everything".
- Consistent meter per section so it's singable; mix perfect and slant rhymes; vary line length.
- Structure (about 2:30–3:15): [Intro] (optional) → [Verse 1] → [Pre-Chorus] → [Chorus] → [Post-Chorus] (if upbeat) → [Verse 2] → [Pre-Chorus] → [Chorus] → [Bridge] → [Final Chorus] (change one line as a payoff) → [Outro] (the hook, 1–2 lines).
- The bridge holds the most specific, emotional memory or the sender's message.
- Write lyrics in ${d.lang==="Other"?"English":d.lang}${LANG_NOTE[d.lang]||""}. Match the feeling: ${d.mood}.
${tweak?`\nREVISION REQUEST: ${tweak}\nKeep everything the viral rules require.\nPrevious version to revise:\n${prev}\n`:""}
STYLE PROMPT for the AI music engine (max 450 characters, no artist or song names): start from the playbook sound above and keep its core descriptors, then add the vocal (${d.voice==="Surprise me"?"choose the voice that best fits this style":d.voice} vocal, described by tone and texture) and realism cues (close-mic, audible breaths, natural vibrato, live-played instruments, slight human timing, warm analog mix, room reverb). End with the mood.

Return ONLY JSON, no markdown:
{"title":"...","sections":[{"type":"Verse 1","lines":["..."]}],"clip":{"section":"Chorus","lines":["...","..."]},"style":"...","why":"one warm sentence to the sender on which memory anchors the song"}`;
}
function parseSong(t){
  const s=t.indexOf("{"),e=t.lastIndexOf("}");if(s<0||e<0)throw new Error("The songwriter returned something unexpected. Try again.");

}

}

    <div class="label">Your email</div><input type="text" id="oEmail" inputmode="email" autocomplete="email" placeholder="you@email.com" value="${esc(d.email||"")}">
    <div class="label">Phone <span class="hint">(optional, for a text when it's ready)</span></div><input type="text" id="oPhone" inputmode="tel" autocomplete="tel" placeholder="(555) 555-5555" value="${esc(d.phone||"")}">
    <button class="btn primary" id="orderBtn" style="width:100%;margin-top:16px">Make ${esc(d.name)}'s song${payments&&price?` · ${esc(price)}`:""}</button>
    <p class="hint" style="text-align:center;margin-top:10px">${payments?(provider==="paypal"?"🔒 Secure checkout with PayPal · pay with PayPal or a debit/credit card<br>":"🔒 Secure checkout by Stripe · Apple Pay · Google Pay · cards<br>"):""}💯 Unlimited re-dos until it's perfect</p>
    <div id="orderErr"></div>`;
}
function bindResult(){
  document.querySelectorAll(".tool[data-t]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tool").forEach(x=>x.disabled=true);b.textContent="✍️ Rewriting…";write(b.dataset.t)});
  $("#copyLyrics").onclick=()=>copy(`${song.title}\nfor ${d.name}\n\n${lyricsText(song)}`,"Lyrics copied");
  $("#editBtn").onclick=editLyrics;
  const ob=$("#orderBtn");if(ob)ob.onclick=placeOrder;
  const ci=$("#coverIn");if(ci)ci.onchange=async()=>{const f=ci.files[0];if(!f)return;
    try{toast("Preparing your cover…");cover=await makeCover(f);render();toast("Cover added ✦")}catch(e){toast("That photo couldn't be used. Try another.")}};
  const cr=$("#coverRm");if(cr)cr.onclick=()=>{cover=null;render()};
  if(order)document.querySelectorAll(".tool[data-t],#editBtn").forEach(b=>b.disabled=true);
}
function editLyrics(){
  const box=$("#lyr");
  box.innerHTML=`<textarea id="lyrEdit" style="min-height:420px;font-family:'Cormorant Garamond',serif;font-size:17px">${esc(lyricsText(song))}</textarea>
  <button class="btn primary" id="saveLyr" style="width:100%;margin-top:12px">Save lyrics</button>`;
  $("#saveLyr").onclick=()=>{
    const secs=[];let cur=null;
    $("#lyrEdit").value.split("\n").forEach(line=>{const m=line.match(/^\s*\[(.+)\]\s*$/);if(m){cur={type:m[1],lines:[]};secs.push(cur)}else if(line.trim()){if(!cur){cur={type:"Verse",lines:[]};secs.push(cur)}cur.lines.push(line.trim())}});
    if(secs.length){song.sections=secs;song.audio=null}render();toast("Lyrics saved");
  };
}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){toast("Long-press the text to copy")}}
/* Crop any photo to a centered square and shrink it to 1200px JPEG, right on the phone. */
async function makeCover(file){
  if(!/^image\//.test(file.type||"image/"))throw new Error("not an image");
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,side=Math.min(w,h),out=Math.min(1200,side);
  const c=document.createElement("canvas");c.width=c.height=out;
  c.getContext("2d").drawImage(src,(w-side)/2,(h-side)/2,side,side,0,0,out,out);
  return c.toDataURL("image/jpeg",0.86);
}
async function placeOrder(){
  const b=$("#orderBtn"),err=$("#orderErr");
  d.email=$("#oEmail").value.trim();d.phone=$("#oPhone").value.trim();save();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){err.innerHTML=`<div class="err">Please enter a valid email so we can deliver the song.</div>`;return}
  if(!backend){err.innerHTML=`<div class="card" style="text-align:center;margin-top:16px">✦ This is a preview. Ordering and payment open on <b>heartsong.shop</b>.</div>`;return}
  b.disabled=true;b.textContent="Sending to the studio…";err.innerHTML="";
  try{
    const details={who:d.who==="Other"?d.whoOther:d.who,name:d.name,nick:d.nick,pron:d.pron,from:d.from,occasion:d.occasion==="Other"?d.occOther:d.occasion,genre:d.genre,style:niche().n.replace("🔥 ",""),voice:d.voice,mood:d.mood,lang:d.lang,qualities:d.qualities,memories:d.memories,message:d.message};
    const r=await fetch("api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({details,contact:{email:d.email,phone:d.phone},song:{title:song.title,style:song.style,lyrics:lyricsText(song),why:song.why||"",clip:(song.clip&&song.clip.lines||[]).join("\n")},cover})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||"Couldn't place the order");
    if(j.checkoutUrl){
      // Keep the song on this device in case they back out of checkout.
      try{localStorage.setItem("hs_song",JSON.stringify(song))}catch(e){}
      try{if(cover)sessionStorage.setItem("hs_cover",cover)}catch(e){}
      b.textContent="Opening secure checkout…";location.href=j.checkoutUrl;return;
    }
    order={id:j.id,link:j.link,email:d.email};render();toast("Order received 🎶");
  }catch(e){b.disabled=false;b.textContent="Try again";err.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}

// Back from a canceled checkout: bring their song back exactly as it was.
(function(){
  if(!/[?&]canceled=/.test(location.search))return;
  try{const sv=JSON.parse(localStorage.getItem("hs_song"));if(sv&&sv.sections){song=sv;cover=sessionStorage.getItem("hs_cover")||null;step=100;setTimeout(()=>toast("Checkout canceled. Your song is saved."),400)}}catch(e){}
  try{history.replaceState(null,"",location.pathname)}catch(e){}
})();
render();
</script>
</body>
</html>
